name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  deploy-web:
    name: Deploy web worker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write wrangler config
        env:
          WRANGLER_WEB_CONFIG: ${{ secrets.WRANGLER_WEB_CONFIG }}
        run: echo "$WRANGLER_WEB_CONFIG" > apps/web/wrangler.jsonc

      - name: Deploy
        run: pnpm --filter @gantt-quest/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-slack:
    name: Deploy Slack worker
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write wrangler config
        env:
          WRANGLER_SLACK_CONFIG: ${{ secrets.WRANGLER_SLACK_CONFIG }}
        run: echo "$WRANGLER_SLACK_CONFIG" > apps/slack/wrangler.jsonc

      - name: Deploy
        run: pnpm --filter @gantt-quest/slack run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
