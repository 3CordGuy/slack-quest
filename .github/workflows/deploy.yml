name: Deploy

on:
  push:
    branches: [main]
    # The game (apps/game, packages/world) deploys by deploy-game.yml or by hand;
    # a push that only touches it, or only docs, leaves the legacy apps alone.
    paths-ignore:
      - "apps/game/**"
      - "packages/world/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/deploy-game.yml"

permissions:
  contents: read

jobs:
  # Apply D1 migrations BEFORE deploying workers, so a worker is never live
  # against a schema that's missing the columns it expects. Migrations are
  # idempotent (wrangler tracks applied ones in d1_migrations); a run with
  # no new migrations is a no-op.
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write wrangler config
        env:
          WRANGLER_SLACK_CONFIG: ${{ secrets.WRANGLER_SLACK_CONFIG }}
        run: echo "$WRANGLER_SLACK_CONFIG" > apps/slack/wrangler.jsonc

      - name: Migrate
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy web worker
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write wrangler config
        env:
          WRANGLER_WEB_CONFIG: ${{ secrets.WRANGLER_WEB_CONFIG }}
        run: echo "$WRANGLER_WEB_CONFIG" > apps/web/wrangler.jsonc

      - name: Deploy
        run: pnpm --filter @gantt-quest/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-slack:
    name: Deploy Slack worker
    runs-on: ubuntu-latest
    needs: [migrate, deploy-web]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write wrangler config
        env:
          WRANGLER_SLACK_CONFIG: ${{ secrets.WRANGLER_SLACK_CONFIG }}
        run: echo "$WRANGLER_SLACK_CONFIG" > apps/slack/wrangler.jsonc

      - name: Deploy
        run: pnpm --filter @gantt-quest/slack run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
